<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protein Journey · visual demo recording</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Scenes 1–9 · short visual demo</h1><p>This records 48 seconds of accelerated, continuous canvas playback with captions. It has no audio and skips prediction pauses for the recording only.</p><button id="record">Record visual demo</button><p id="message" role="status">Ready.</p><a id="download" hidden download="Protein_Journey_Complete_Demo.webm">Download visual demo</a><iframe id="tutorial" src="index.html" title="Protein Journey demo" style="width:100%;height:1000px;border:0"></iframe></main><script>
const btn=document.getElementById('record'),msg=document.getElementById('message'),iframe=document.getElementById('tutorial');btn.onclick=()=>{btn.disabled=true;let win=iframe.contentWindow,doc=iframe.contentDocument,src=doc.getElementById('canvas'),out=document.createElement('canvas');out.width=1400;out.height=860;let ctx=out.getContext('2d');let stream=out.captureStream(30),chunks=[],rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let link=document.getElementById('download');link.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));link.hidden=false;msg.textContent='Recording ready.';btn.disabled=false;stream.getTracks().forEach(t=>t.stop())};rec.start();let start=performance.now();msg.textContent='Recording continuous playback…';function frame(now){let p=Math.min(1,(now-start)/48000);win.journey.seek(p*720);ctx.fillStyle='#f2f7fa';ctx.fillRect(0,0,1400,860);ctx.drawImage(src,0,0);ctx.fillStyle='#14364e';ctx.font='bold 24px Arial';ctx.fillText(doc.getElementById('title').textContent,36,794);ctx.font='18px Arial';let words=doc.getElementById('caption').textContent.split(' '),line='',y=830;for(let word of words){if(ctx.measureText(line+' '+word).width>1320){ctx.fillText(line,36,y);y+=22;line=word}else line+=(line?' ':'')+word}ctx.fillText(line,36,y);if(p<1)requestAnimationFrame(frame);else rec.stop()}requestAnimationFrame(frame)};
</script></body></html>
